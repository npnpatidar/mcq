name: Build and test

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only needs to read the repository. The single
# write grant lives in release.yml's publish job.
permissions:
  contents: read

# One in-flight run per branch/PR: a new push cancels the stale one instead of
# queueing behind it and freeing a runner only after the superseded work ends.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    # The wrapper jar runs with full privileges on every runner below;
    # check it against Gradle's published checksums before any job can
    # execute it (supply-chain: a tampered gradle-wrapper.jar is game over).
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

  build:
    needs: wrapper-validation
    # x86_64 runners: Robolectric's native runtime and the Conscrypt JNI
    # only ship x86_64 Linux binaries, so the DB-backed unit tests run
    # here (they cannot run on ARM64 Linux hosts).
    runs-on: ubuntu-latest
    # Hard backstop above setup (~5 min) plus the Gradle test task's own
    # 10-minute timeout. It must stay above that sum: at 15 minutes the job
    # timeout preempted the Gradle one, killing the job before the test task
    # could report which test wedged.
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default package list includes the long-removed
          # `tools` package and fails; install only what exists.
          packages: platform-tools

      - name: Install Android platform and build tools
        # NOTE: the API-37 platform packages are versioned (android-37.0…);
        # bare `platforms;android-37` does not exist.
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build debug APK and run unit tests
        # No aapt2 override: the bundled aapt2 runs natively on x86_64
        # (the override is only needed on ARM64 hosts with QEMU).
        # Force remote re-resolution: a restored Gradle cache has repeatedly
        # served stale plugin metadata (compose 2.2.10 not found) in this job.
        #
        # TEMP DIAGNOSTIC: the unit suite has wedged at a different class each
        # run. Dump the test worker's stacks from the outside (the Gradle task
        # timeout only kills it), so a wedge names the thread that is stuck.
        shell: bash
        run: |
          ( sleep 420; for pid in $(pgrep -f GradleWorkerMain || true); do
              echo "=== WEDGE DUMP (7 min) pid=$pid ==="; jstack "$pid" || true
            done; sleep 120; for pid in $(pgrep -f GradleWorkerMain || true); do
              echo "=== WEDGE DUMP (9 min) pid=$pid ==="; jstack "$pid" || true
            done ) &
          WATCH=$!
          sh gradlew :app:assembleDebug :app:testDebugUnitTest --refresh-dependencies --no-daemon
          STATUS=$?
          kill "$WATCH" 2>/dev/null || true
          exit $STATUS

      - name: Lint
        # Catches the Android-specific problems the unit tests cannot: missing
        # content descriptions, wrong API usage, unused resources.
        # Same forced re-resolution: the restored cache cannot be trusted here.
        run: sh gradlew :app:lintDebug --refresh-dependencies --no-daemon

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: error

  release-build:
    # Nothing built the release variant, so a release-only breakage (missing
    # ProGuard rules, a resource that only the release path touches) would
    # only surface at release time. This assembles it on every push.
    #
    # This does exercise shrinking: the release build sets isMinifyEnabled =
    # true and isShrinkResources = true, so this job is what catches a missing
    # keep rule or a resource that only the release path touches.
    needs: wrapper-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Restore signing key
        id: signing
        # Secrets cannot be used in a job-level `if`, so this probes one and
        # exports the result. With no secrets the release variant still builds,
        # just unsigned — which keeps the job useful on forks.
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No RELEASE_KEYSTORE_BASE64 secret: building unsigned."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            # keystore.properties does not exist until the next step; masking
            # it here only masked an empty string. The real masks are added
            # below, after the file is written.
          fi

      - name: Write signing properties
        if: steps.signing.outputs.available == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          # Mask every secret the file contains, including the alias, and only
          # after the file exists.
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"

      - name: Build release APK
        # Same forced re-resolution as the build/lint jobs: this job restores
        # the same Gradle cache, so stale plugin metadata can hit it too.
        run: sh gradlew :app:assembleRelease --refresh-dependencies --no-daemon

      - name: Report the release APK size
        run: du -h app/build/outputs/apk/release/*.apk || true

      - name: Remove the key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ui-test:
    # Emulator UI test: boots an x86_64 emulator and runs the critical
    # path (library -> test -> submit -> results). Separate job so JVM
    # unit-test results never depend on emulator boot time.
    needs: wrapper-validation
    runs-on: ubuntu-latest
    # Emulator boot plus the instrumented suite must not hang the whole
    # workflow indefinitely; 30 min is well above a normal run.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        # Same explicit packages as the build job. Relying on AGP to
        # auto-download them made this job depend on the runner's cache
        # state.
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          # Every instrumented test runs: the suite used to skip a handful via
          # a system-property switch, but that property was never passed to the
          # on-device test process, so the switch silently did nothing.
          script: sh gradlew :app:connectedDebugAndroidTest --refresh-dependencies --no-daemon

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-test-results
          path: app/build/outputs/androidTest-results/
          if-no-files-found: error
