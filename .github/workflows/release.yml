name: Publish release

# Pushing a version tag builds, signs and publishes the APK to a GitHub
# Release automatically, so a release never has to be assembled by hand.
# Example:
#   git tag 0.0.1 && git push origin 0.0.1
on:
  push:
    tags:
      # Glob, not regex: "*.*.*" is any tag with two dots, i.e. semver.
      - '*.*.*'

permissions:
  contents: write

jobs:
  wrapper-validation:
    # The wrapper jar runs with full privileges in the publish job below;
    # check it against Gradle's published checksums first (supply-chain: a
    # tampered gradle-wrapper.jar is game over).
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

  publish:
    needs: wrapper-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set; cannot publish a signed build."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Write signing properties
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

      - name: Build signed release APK
        run: sh gradlew :app:assembleRelease --no-daemon

      - name: Remove the key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Collect the APK and its checksum
        id: collect
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          version="${GITHUB_REF_NAME}"
          name="mcq-${version}-signed.apk"
          mkdir -p dist
          cp "$apk" "dist/$name"
          cd dist && sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-existing release for this tag (created by hand, say) is
          # reused rather than duplicated; --clobber replaces the asset so a
          # re-run of the same tag produces one canonical file.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [ -n "$previous" ]; then
              gh release create "$GITHUB_REF_NAME" \
                --title "$GITHUB_REF_NAME" --generate-notes --notes-start-tag "$previous"
            else
              # First tag: no baseline to diff against.
              gh release create "$GITHUB_REF_NAME" \
                --title "$GITHUB_REF_NAME" --generate-notes
            fi
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "dist/${{ steps.collect.outputs.name }}" \
            "dist/${{ steps.collect.outputs.name }}.sha256" \
            --clobber
          echo "Published ${{ steps.collect.outputs.name }} to release $GITHUB_REF_NAME"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Released $GITHUB_REF_NAME"
            echo ""
            echo "Signed APK and SHA-256 are attached to the GitHub Release."
            echo "Keystore fingerprint: \`46:81:51:D2:0E:73:BD:BE:73:F3:BA:E6:4C:CE:C0:98:21:D3:E6:17:34:C4:BC:8F:62:74:36:18:4C:7D:F8:3E\`"
          } >> "$GITHUB_STEP_SUMMARY"
