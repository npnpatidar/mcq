name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  # Per-PR builds deliberately do NOT pass --refresh-dependencies: forcing
  # re-resolution on every step turned one transient plugin fetch or a Maven
  # 429 into a failed PR. This nightly run re-resolves against the repositories
  # on its own, so a stale-plugin or repository problem surfaces in a dedicated
  # run instead of holding a branch. The wrapper's 60 s timeout and three
  # retries cover the distribution download only — not plugin resolution — so a
  # transient plugin fetch on a PR fails that step and is retried by the next
  # push; the refreshed metadata reaches the PR jobs through the shared rotating
  # cache below — see the cache step in each job for why a run-scoped key is
  # required for that to work.
  schedule:
    - cron: '17 1 * * *' # 01:17 UTC = 06:47 IST, daily

# Least privilege: every job only needs to read the repository. The single
# write grant lives in release.yml's publish job.
permissions:
  contents: read

# One in-flight run per branch/PR: a new push cancels the stale one instead of
# queueing behind it and freeing a runner only after the superseded work ends.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    # The wrapper jar runs with full privileges on every runner below;
    # check it against Gradle's published checksums before any job can
    # execute it (supply-chain: a tampered gradle-wrapper.jar is game over).
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

  nightly-dependency-refresh:
    # The single place allowed to force remote re-resolution. A stale plugin
    # POM or a repository outage then fails this standalone nightly run with a
    # clear signal instead of failing every PR; the per-PR jobs stay fast and
    # deterministic. Runs only on the schedule, never on a PR.
    if: github.event_name == 'schedule'
    needs: wrapper-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
        # No `cache: gradle`: setup-java keys that cache on a hash of the build
        # files. An unchanged repo is an exact hit, and actions/cache does NOT
        # save a cache on a hit, so the forced refresh below would be discarded
        # and PRs would keep restoring the stale metadata. We manage the cache
        # ourselves with a key that always misses instead.

      - name: Restore Gradle cache
        # actions/cache only saves when the key is new. setup-java's hash key
        # is an exact hit on an unchanged repo, so its post-job save is skipped;
        # a run-scoped key always misses and therefore always stores the cache
        # after --refresh-dependencies. Every job shares the `gradle-nightly-`
        # restore prefix, so the next run — PRs included — starts from the most
        # recently refreshed cache. GitHub's key matching:
        # https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#matching-a-cache-key
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-nightly-${{ github.run_id }}
          restore-keys: gradle-nightly-

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Refresh resolved dependencies and plugin metadata
        # `dependencies` walks every configuration, so this re-resolves the
        # plugins the bootstrap tasks fetch as well as the app's own graph.
        # The restored cache is saved by the step above under a fresh run-scoped
        # key, which is what later PR runs restore.
        run: sh gradlew :app:dependencies --refresh-dependencies --no-daemon

  test-durations:
    # `apk-build/test-shards.sh` can partition by measured cost, but a manifest
    # has to exist first. One unsharded pass produces the JUnit XML, and
    # `writeTestDurations` turns it into `test-durations.tsv`, which the four
    # shards restore from a cross-run cache and pass as the script's third
    # argument. This is a measurement pass, not a PR gate: running the whole
    # unsharded suite on every PR doubled the work and a hung probe skipped the
    # shards entirely. Nightly and main builds refresh the manifest; PR shards
    # reuse the newest one and fall back to balanced-by-count when none exists.
    if: github.event_name == 'schedule' || github.event_name == 'push'
    needs: wrapper-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
        # Cache is managed by the shared actions/cache step below, not here.

      - name: Restore Gradle cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-run-${{ github.run_id }}
          # The nightly refresh first; a run-scoped cache saved by an earlier
          # PR is restorable too (a save under a key no restore prefix matches
          # would be dead weight and never speed up a later run).
          restore-keys: |
            gradle-nightly-
            gradle-run-

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Measure class durations
        # This job is only a measurement pass; the sharded job below is the
        # authoritative gate. A failing/hung pass must still leave a usable
        # (possibly empty) manifest so the shards fall back cleanly.
        continue-on-error: true
        shell: bash
        run: sh gradlew :app:testDebugUnitTest --no-daemon

      - name: Write duration manifest
        if: always()
        run: sh gradlew :app:writeTestDurations --no-daemon

      - name: Upload test durations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-durations
          path: app/build/test-durations.tsv
          if-no-files-found: error

      - name: Stage duration manifest for cross-run cache
        # PR runs have no probe of their own, so the manifest has to survive
        # into later runs. Stage it under a path the shard jobs restore as-is.
        if: always()
        shell: bash
        run: cp app/build/test-durations.tsv apk-build/test-durations.tsv || true

      - name: Cache measured test durations
        # A run-scoped key always misses (actions/cache does not save on a hit),
        # and the stable `test-durations-` prefix lets PR jobs restore the most
        # recently written manifest. The probe's own artifact stays for humans.
        if: always()
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: apk-build/test-durations.tsv
          key: test-durations-${{ github.run_id }}
          restore-keys: test-durations-

  build:
    needs: wrapper-validation
    # x86_64 runners: Robolectric's native runtime and the Conscrypt JNI
    # only ship x86_64 Linux binaries, so the DB-backed unit tests run
    # here (they cannot run on ARM64 Linux hosts).
    runs-on: ubuntu-latest
    # Hard backstop above setup (~5 min) plus the Gradle test task's own
    # 10-minute timeout. It must stay above that sum: at 15 minutes the job
    # timeout preempted the Gradle one, killing the job before the test task
    # could report which test wedged.
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
        # Cache is managed by the shared actions/cache step below: setup-java's
        # hash key would be an exact hit and never store the nightly refresh.

      - name: Restore Gradle cache
        # A separate run-scoped namespace from the nightly job: jobs run in
        # parallel on a schedule, and a non-refresh job saving under the
        # nightly's exact key would win the race and discard the fresh metadata.
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-run-${{ github.run_id }}
          # The nightly refresh first; a run-scoped cache saved by an earlier
          # PR is restorable too (a save under a key no restore prefix matches
          # would be dead weight and never speed up a later run).
          restore-keys: |
            gradle-nightly-
            gradle-run-

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default package list includes the long-removed
          # `tools` package and fails; install only what exists.
          packages: platform-tools

      - name: Install Android platform and build tools
        # NOTE: the API-37 platform packages are versioned (android-37.0…);
        # bare `platforms;android-37` does not exist.
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build debug APK
        # No aapt2 override: the bundled aapt2 runs natively on x86_64
        # (the override is only needed on ARM64 hosts with QEMU).
        # No --refresh-dependencies: the nightly job refreshes the shared
        # cache. The wrapper does not retry plugin resolution, so a transient
        # fetch here fails the step and the next push tries again.
        run: sh gradlew :app:assembleDebug --no-daemon

      - name: Lint
        # Catches the Android-specific problems the unit tests cannot: missing
        # content descriptions, wrong API usage, unused resources.
        run: sh gradlew :app:lintDebug --no-daemon

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: error

  unit-test:
    # The Robolectric suite has wedged at a different class in one worker per
    # run (a lost wakeup: every background thread parked, the main thread
    # inside runBlocking, nothing scheduled anywhere in the JVM). Splitting
    # the classes over a 4-way parallel matrix shrinks the state one worker
    # accumulates (the process-wide DataStore actor is the coupling), halves
    # the wall clock, and makes one bad shard report alone instead of holding
    # the branch. No test is skipped: the four shards are a partition, including
    # subpackage classes (asserted by TestShardScriptTest).
    # Deliberately NOT `needs: test-durations`: that probe is a nightly/main
    # measurement, absent on PRs, and a hung/failed unsharded pass must never
    # skip the shards. The manifest is restored from cache below instead.
    needs: wrapper-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
        # Cache is managed by the shared actions/cache step below: setup-java's
        # hash key would be an exact hit and never store the nightly refresh.

      - name: Restore Gradle cache
        # A separate run-scoped namespace from the nightly job: jobs run in
        # parallel on a schedule, and a non-refresh job saving under the
        # nightly's exact key would win the race and discard the fresh metadata.
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-run-${{ github.run_id }}
          # The nightly refresh first; a run-scoped cache saved by an earlier
          # PR is restorable too (a save under a key no restore prefix matches
          # would be dead weight and never speed up a later run).
          restore-keys: |
            gradle-nightly-
            gradle-run-

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Restore measured test durations
        # The probe only runs on nightly/main, so a PR has no artifact in this
        # run. Restore the newest manifest an earlier such run cached. With no
        # cache yet (a first PR) the shard step below uses the two-argument
        # balanced-by-count call instead — no shard waits on the probe.
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: apk-build/test-durations.tsv
          key: test-durations-${{ github.run_id }}
          restore-keys: test-durations-

      - name: Run unit test shard
        # Sentinel: if this shard wedges, dump the worker's stacks from the
        # outside at 7 and 9 minutes so the log names the stuck thread — the
        # Gradle task timeout only kills the worker.
        shell: bash
        run: |
          set -eu
          ( sleep 420; for pid in $(pgrep -f GradleWorkerMain || true); do
              echo "=== WEDGE DUMP (7 min) pid=$pid ==="; jstack "$pid" || true
            done; sleep 120; for pid in $(pgrep -f GradleWorkerMain || true); do
              echo "=== WEDGE DUMP (9 min) pid=$pid ==="; jstack "$pid" || true
            done ) &
          WATCH=$!
          trap 'kill "$WATCH" 2>/dev/null || true' EXIT
          if [ -f apk-build/test-durations.tsv ]; then
            ARGS=$(sh apk-build/test-shards.sh ${{ matrix.shard }} 4 apk-build/test-durations.tsv)
          else
            # No cached manifest yet: the original balanced-by-count partition.
            # This keeps every class in exactly one shard, just not cost-weighted.
            ARGS=$(sh apk-build/test-shards.sh ${{ matrix.shard }} 4)
          fi
          sh gradlew :app:testDebugUnitTest $ARGS --no-daemon

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: error


  release-build:
    # Nothing built the release variant, so a release-only breakage (missing
    # ProGuard rules, a resource that only the release path touches) would
    # only surface at release time. This assembles it on every push.
    #
    # This does exercise shrinking: the release build sets isMinifyEnabled =
    # true and isShrinkResources = true, so this job is what catches a missing
    # keep rule or a resource that only the release path touches.
    needs: wrapper-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
        # Cache is managed by the shared actions/cache step below: setup-java's
        # hash key would be an exact hit and never store the nightly refresh.

      - name: Restore Gradle cache
        # A separate run-scoped namespace from the nightly job: jobs run in
        # parallel on a schedule, and a non-refresh job saving under the
        # nightly's exact key would win the race and discard the fresh metadata.
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-run-${{ github.run_id }}
          # The nightly refresh first; a run-scoped cache saved by an earlier
          # PR is restorable too (a save under a key no restore prefix matches
          # would be dead weight and never speed up a later run).
          restore-keys: |
            gradle-nightly-
            gradle-run-

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Restore signing key
        id: signing
        # Secrets cannot be used in a job-level `if`, so this probes one and
        # exports the result. With no secrets the release variant still builds,
        # just unsigned — which keeps the job useful on forks.
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No RELEASE_KEYSTORE_BASE64 secret: building unsigned."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            # keystore.properties does not exist until the next step; masking
            # it here only masked an empty string. The real masks are added
            # below, after the file is written.
          fi

      - name: Write signing properties
        if: steps.signing.outputs.available == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          # Mask every secret the file contains, including the alias, and only
          # after the file exists.
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"

      - name: Build release APK
        # Cache is refreshed nightly; no per-build forced re-resolution.
        run: sh gradlew :app:assembleRelease --no-daemon

      - name: Report the release APK size
        run: du -h app/build/outputs/apk/release/*.apk || true

      - name: Remove the key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ui-test:
    # Emulator UI test: boots an x86_64 emulator and runs the critical
    # path (library -> test -> submit -> results). Separate job so JVM
    # unit-test results never depend on emulator boot time.
    needs: wrapper-validation
    runs-on: ubuntu-latest
    # Emulator boot plus the instrumented suite must not hang the whole
    # workflow indefinitely; 30 min is well above a normal run.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
        # Cache is managed by the shared actions/cache step below: setup-java's
        # hash key would be an exact hit and never store the nightly refresh.

      - name: Restore Gradle cache
        # A separate run-scoped namespace from the nightly job: jobs run in
        # parallel on a schedule, and a non-refresh job saving under the
        # nightly's exact key would win the race and discard the fresh metadata.
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-run-${{ github.run_id }}
          # The nightly refresh first; a run-scoped cache saved by an earlier
          # PR is restorable too (a save under a key no restore prefix matches
          # would be dead weight and never speed up a later run).
          restore-keys: |
            gradle-nightly-
            gradle-run-

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        # Same explicit packages as the build job. Relying on AGP to
        # auto-download them made this job depend on the runner's cache
        # state.
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          # Every instrumented test runs: the suite used to skip a handful via
          # a system-property switch, but that property was never passed to the
          # on-device test process, so the switch silently did nothing.
          script: sh gradlew :app:connectedDebugAndroidTest --no-daemon

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-test-results
          path: app/build/outputs/androidTest-results/
          if-no-files-found: error
