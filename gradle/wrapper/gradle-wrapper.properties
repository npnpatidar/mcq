distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.1-bin.zip
# Transient plugin/Maven fetches failed often enough to break unrelated PRs.
# A 60 s socket timeout and three retries make the wrapper ride out a slow
# mirror or a 429 instead of failing the run on the first hiccup.
networkTimeout=60000
retries=3
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
