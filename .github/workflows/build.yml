name: Build and test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  wrapper-validation:
    # The wrapper jar runs with full privileges on every runner below;
    # check it against Gradle's published checksums before any job can
    # execute it (supply-chain: a tampered gradle-wrapper.jar is game over).
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

  build:
    needs: wrapper-validation
    # x86_64 runners: Robolectric's native runtime and the Conscrypt JNI
    # only ship x86_64 Linux binaries, so the DB-backed unit tests run
    # here (they cannot run on ARM64 Linux hosts).
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the long-removed
          # `tools` package and fails; install only what exists.
          packages: platform-tools

      - name: Install Android platform and build tools
        # NOTE: the API-37 platform packages are versioned (android-37.0…);
        # bare `platforms;android-37` does not exist.
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build debug APK and run unit tests
        # No aapt2 override: the bundled aapt2 runs natively on x86_64
        # (the override is only needed on ARM64 hosts with QEMU).
        run: sh gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Lint
        # Catches the Android-specific problems the unit tests cannot: missing
        # content descriptions, wrong API usage, unused resources.
        run: sh gradlew :app:lintDebug --no-daemon

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  release-build:
    # Nothing built the release variant, so a release-only breakage (missing
    # ProGuard rules, a resource that only the release path touches) would
    # only surface at release time. This assembles it on every push.
    #
    # Note this does NOT yet exercise shrinking: isMinifyEnabled is still
    # false, so the artifact is ~15 MB rather than the ~3.6 MB measured with R8
    # on. Turning minify on is a one-line change and this job is what would
    # catch it going wrong.
    needs: wrapper-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Restore signing key
        id: signing
        # Secrets cannot be used in a job-level `if`, so this probes one and
        # exports the result. With no secrets the release variant still builds,
        # just unsigned — which keeps the job useful on forks.
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No RELEASE_KEYSTORE_BASE64 secret: building unsigned."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "::add-mask::$(cat keystore.properties 2>/dev/null || true)"
          fi

      - name: Write signing properties
        if: steps.signing.outputs.available == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

      - name: Build release APK
        run: sh gradlew :app:assembleRelease --no-daemon

      - name: Report the release APK size
        run: du -h app/build/outputs/apk/release/*.apk || true

      - name: Remove the key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

  ui-test:
    # Emulator UI test: boots an x86_64 emulator and runs the critical
    # path (library -> test -> submit -> results). Separate job so JVM
    # unit-test results never depend on emulator boot time.
    needs: wrapper-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        # Same explicit packages as the build job. Relying on AGP to
        # auto-download them made this job depend on the runner's cache
        # state.
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: sh gradlew :app:connectedDebugAndroidTest --no-daemon

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: app/build/outputs/androidTest-results/
