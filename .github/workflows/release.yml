name: Publish release

# Pushing a version tag builds, signs and publishes the APK to a GitHub
# Release automatically, so a release never has to be assembled by hand.
# Example:
#   git tag 0.0.1 && git push origin 0.0.1
on:
  push:
    tags:
      # Glob, not regex: "*.*.*" is any tag with two dots, i.e. semver.
      - '*.*.*'

# Read-only by default: only the publish job below needs to write the release.
permissions:
  contents: read

# One in-flight run per tag; re-pushing a tag supersedes the earlier attempt.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    # The wrapper jar runs with full privileges in the publish job below;
    # check it against Gradle's published checksums first (supply-chain: a
    # tampered gradle-wrapper.jar is game over).
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

  publish:
    needs: wrapper-validation
    runs-on: ubuntu-latest
    # The only job allowed to write: creating the release and uploading assets.
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history + tags: `git describe ... HEAD^` in the publish step
          # needs the previous release tag reachable, which a shallow clone omits.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set; cannot publish a signed build."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Write signing properties
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          # Mask every secret in the file, including the key alias.
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"

      - name: Build signed release APK
        # build.yml's nightly job refreshes the shared Gradle cache; a tag
        # build must not fail on a transient plugin fetch the way a blanket
        # --refresh-dependencies on every step did.
        run: sh gradlew :app:assembleRelease --no-daemon

      - name: Remove the key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Collect the APK and its checksum
        id: collect
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          version="${GITHUB_REF_NAME}"
          name="mcq-${version}-signed.apk"
          mkdir -p dist
          cp "$apk" "dist/$name"
          cd dist && sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-existing release for this tag (created by hand, say) is
          # reused rather than duplicated; --clobber replaces the asset so a
          # re-run of the same tag produces one canonical file.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [ -n "$previous" ]; then
              gh release create "$GITHUB_REF_NAME" \
                --title "$GITHUB_REF_NAME" --generate-notes --notes-start-tag "$previous"
            else
              # First tag: no baseline to diff against.
              gh release create "$GITHUB_REF_NAME" \
                --title "$GITHUB_REF_NAME" --generate-notes
            fi
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "dist/${{ steps.collect.outputs.name }}" \
            "dist/${{ steps.collect.outputs.name }}.sha256" \
            --clobber
          echo "Published ${{ steps.collect.outputs.name }} to release $GITHUB_REF_NAME"

          # Reminder only, never a gate: --generate-notes never contains the
          # owner's plain-language "What's new for you" section. A warning
          # annotation makes the manual step visible in the run without
          # failing the publish; the supervisor adds it afterwards with
          # `gh release edit --notes-file`.
          body=$(gh release view "$GITHUB_REF_NAME" --json body --jq '.body' 2>/dev/null || true)
          if ! printf '%s' "$body" | grep -qF "What's new for you"; then
            echo "::warning::Release $GITHUB_REF_NAME has no 'What's new for you' section — add the user-facing notes before announcing it (gh release edit $GITHUB_REF_NAME --notes-file <file>)."
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Released $GITHUB_REF_NAME"
            echo ""
            echo "Signed APK and SHA-256 are attached to the GitHub Release."
            echo "Keystore fingerprint: \`46:81:51:D2:0E:73:BD:BE:73:F3:BA:E6:4C:CE:C0:98:21:D3:E6:17:34:C4:BC:8F:62:74:36:18:4C:7D:F8:3E\`"
          } >> "$GITHUB_STEP_SUMMARY"
