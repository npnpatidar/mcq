# The default application for every Robolectric test in this module.
#
# Without this, a class with no `@Config(application = ...)` inherits the
# manifest's `McqApplication`, whose `onCreate` launches the real first-start
# probe: it opens the database file and writes `install_first_start_new` and
# `correctness_only` into the process-wide DataStore, racing each test's own
# fixture and the clears in SettingsResetRule.
#
# A class-level or method-level `@Config(application = ...)` still wins. Only
# StartupTest opts back into the production application, because the startup
# path itself is what it tests.
application=com.mcqapp.TestMcqApplication
